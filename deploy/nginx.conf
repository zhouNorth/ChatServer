# Ubuntu package: nginx + libnginx-mod-stream.
# Run with: nginx -p "$PWD/.run/" -c "$PWD/deploy/nginx.conf"
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
worker_processes 1;
pid nginx.pid;
error_log error.log info;
events {
    worker_connections 1024;
}
stream {
    log_format chat '$remote_addr:$remote_port -> $upstream_addr '
                    'status=$status sent=$bytes_sent received=$bytes_received '
                    'duration=$session_time';
    access_log access.log chat;
    upstream chat_servers {
        least_conn;
        server 127.0.0.1:6001 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:6002 max_fails=2 fail_timeout=10s;
    }
    server {
        listen 127.0.0.1:8000;
        proxy_connect_timeout 3s;
        proxy_timeout 1h;
        proxy_socket_keepalive on;
        proxy_next_upstream on;
        proxy_next_upstream_tries 2;
        proxy_pass chat_servers;
    }
}
